[platformio]
src_dir = video
build_dir = ${sysenv.SPRITE_AFFINE_PIO_BUILD_DIR}
libdeps_dir = ${sysenv.SPRITE_AFFINE_PIO_LIBDEPS_DIR}

[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
framework = arduino
lib_deps =
    ${sysenv.SPRITE_AFFINE_RENDERER_ROOT}
    fbiego/ESP32Time@^2.0.0
    robtillaart/CRC@^1.0.3
build_unflags =
    -Os
    -std=c++11
    -std=gnu++11
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=c++17
    -std=gnu++17
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 600000
